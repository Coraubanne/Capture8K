<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Capture8K</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <img src="icons/capture8k-mark.svg" alt="">
          <span id="format-mark">8K</span>
        </div>
        <div class="brand-copy">
          <h1>Capture8K</h1>
          <span>Capture haute définition</span>
        </div>
      </div>
      <button id="settings-toggle" class="folder-toggle" type="button" aria-label="Ouvrir les réglages" title="Réglages">
        <span class="gear" aria-hidden="true">✦</span>
      </button>
    </header>
    <main id="capture-view">
      <fieldset class="resolution-picker">
        <legend>Définition de la capture</legend>
        <div class="resolution-options">
          <label>
            <input type="radio" name="resolution" value="4k">
            <span>4K</span>
          </label>
          <label>
            <input type="radio" name="resolution" value="8k" checked>
            <span>8K</span>
          </label>
        </div>
      </fieldset>

      <button id="capture" type="button">
        <span class="camera" aria-hidden="true"></span>
        <span id="capture-label">Capturer en 8K</span>
      </button>

      <section id="status" class="status ready" aria-live="polite">
        <div class="status-line">
          <span id="status-icon" class="status-icon" aria-hidden="true"></span>
          <span id="status-text">Prêt</span>
        </div>
        <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
      </section>

      <section class="companion" aria-label="État de l’application Capture8K">
        <span class="native-dot" aria-hidden="true"></span>
        <span id="native-label">Vérification…</span>
      </section>
    </main>
    <main id="settings-view" class="settings-view" hidden>
      <section class="settings-card">
        <h2>Réglages</h2>
        <p>Personnalisez Capture8K</p>
        <label class="setting-label" for="destination">ENREGISTREMENT</label>
        <select id="destination">
          <option value="downloads">Téléchargements</option>
          <option value="premiere">Premiere Pro</option>
          <option value="custom">Autre dossier…</option>
        </select>
        <span id="destination-detail" class="setting-detail"></span>
        <button id="check-update" class="update-button" type="button">Chercher une mise à jour</button>
        <span id="update-status" class="setting-detail">Capture8K est à jour.</span>
      </section>
    </main>
    <footer id="extension-version" class="extension-version"></footer>
    <script src="popup.js"></script>
  </body>
</html>
