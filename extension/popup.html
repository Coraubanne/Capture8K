<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Capture8K</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <img src="icons/capture8k-mark.svg" alt="">
          <span id="format-mark">8K</span>
        </div>
        <div class="brand-copy">
          <h1>Capture8K</h1>
          <span>Capture haute définition</span>
        </div>
      </div>
      <button id="open-app" class="folder-toggle" type="button" aria-label="Choisir le dossier d’export" title="Dossier d’export">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.75 5.75A2.75 2.75 0 0 1 6.5 3h3.1c.73 0 1.43.29 1.95.8l1.2 1.2h4.75a2.75 2.75 0 0 1 2.75 2.75v8.5A2.75 2.75 0 0 1 17.5 19H6.5a2.75 2.75 0 0 1-2.75-2.75V5.75Zm2.75-.8a.8.8 0 0 0-.8.8v.75h12.6a.8.8 0 0 0-.8-.55h-5.56l-1.77-1.76a.8.8 0 0 0-.57-.24H6.5Z"/>
        </svg>
      </button>
    </header>
    <main>
      <fieldset class="resolution-picker">
        <legend>Définition de la capture</legend>
        <div class="resolution-options">
          <label>
            <input type="radio" name="resolution" value="4k">
            <span>4K</span>
          </label>
          <label>
            <input type="radio" name="resolution" value="8k" checked>
            <span>8K</span>
          </label>
        </div>
      </fieldset>

      <button id="capture" type="button">
        <span class="camera" aria-hidden="true"></span>
        <span id="capture-label">Capturer en 8K</span>
      </button>

      <section id="status" class="status ready" aria-live="polite">
        <div class="status-line">
          <span id="status-icon" class="status-icon" aria-hidden="true"></span>
          <span id="status-text">Prêt</span>
        </div>
        <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
      </section>

      <section class="companion" aria-label="État de l’application Capture8K">
        <span class="native-dot" aria-hidden="true"></span>
        <span id="native-label">Vérification…</span>
      </section>
    </main>
    <footer id="extension-version" class="extension-version"></footer>
    <script src="popup.js"></script>
  </body>
</html>
